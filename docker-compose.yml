name: aegispay

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  merchant-service:
    build:
      context: .
      dockerfile: services/merchant-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/merchant_db
      DB_USER: aegis
      DB_PASSWORD: aegis
    depends_on: [postgres]
    ports: ["8082:8082"]

  fraud-service:
    build:
      context: .
      dockerfile: services/fraud-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      REDIS_HOST: redis
    depends_on: [redis]
    ports: ["8083:8083"]

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USER: aegis
      DB_PASSWORD: aegis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUD_SERVICE_URL: http://fraud-service:8083
    depends_on: [postgres, kafka, fraud-service]
    ports: ["8081:8081"]

  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      DB_USER: aegis
      DB_PASSWORD: aegis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [postgres, kafka]
    ports: ["8084:8084"]

  settlement-service:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/settlement_db
      DB_USER: aegis
      DB_PASSWORD: aegis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [postgres, kafka]
    ports: ["8085:8085"]

  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/webhook_db
      DB_USER: aegis
      DB_PASSWORD: aegis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MERCHANT_SERVICE_URL: http://merchant-service:8082
      WEBHOOK_SIGNING_SECRET: local-development-secret
    depends_on: [postgres, kafka, merchant-service]
    ports: ["8086:8086"]

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      PAYMENT_SERVICE_URL: http://payment-service:8081
      MERCHANT_SERVICE_URL: http://merchant-service:8082
    depends_on: [payment-service, merchant-service]
    ports: ["8080:8080"]

  dashboard:
    build:
      context: .
      dockerfile: frontend/merchant-dashboard/Dockerfile
    depends_on: [api-gateway]
    ports: ["3000:80"]

  prometheus:
    image: prom/prometheus:v3.6.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
  grafana-data:
