apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: aegispay
spec:
  replicas: 2
  selector:
    matchLabels: { app: merchant-service }
  template:
    metadata:
      labels: { app: merchant-service }
    spec:
      containers:
        - name: merchant-service
          image: ghcr.io/naveed24/aegispay-platform/merchant-service:latest
          ports: [{ containerPort: 8082 }]
          envFrom: [{ secretRef: { name: aegispay-secrets } }]
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres.example.internal:5432/merchant_db
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: aegispay
spec:
  selector: { app: merchant-service }
  ports: [{ port: 8082, targetPort: 8082 }]
---
