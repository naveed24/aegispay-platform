apiVersion: v1
kind: Namespace
metadata:
  name: aegispay
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegispay-config
  namespace: aegispay
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka.default.svc.cluster.local:9092
  REDIS_HOST: redis.default.svc.cluster.local
  PAYMENT_SERVICE_URL: http://payment-service:8081
  MERCHANT_SERVICE_URL: http://merchant-service:8082
  FRAUD_SERVICE_URL: http://fraud-service:8083
---
apiVersion: v1
kind: Secret
metadata:
  name: aegispay-secrets
  namespace: aegispay
type: Opaque
stringData:
  DB_USER: replace-me
  DB_PASSWORD: replace-me
  WEBHOOK_SIGNING_SECRET: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aegispay
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/naveed24/aegispay-platform/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: aegispay-config } }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aegispay
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: aegispay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
