          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: aegispay-config }
            - secretRef: { name: aegispay-secrets }
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres.example.internal:5432/ledger_db
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: aegispay
spec:
  selector: { app: ledger-service }
  ports: [{ port: 8084, targetPort: 8084 }]
