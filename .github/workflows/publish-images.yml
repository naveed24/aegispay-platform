name: Publish Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'libs/**'

permissions:
  contents: read
  packages: write

jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - merchant-service
          - payment-service
          - fraud-service
          - ledger-service
          - settlement-service
          - webhook-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/merchant-dashboard/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/dashboard:latest
