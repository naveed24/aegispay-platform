server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

services:
  payment: ${PAYMENT_SERVICE_URL:http://localhost:8081}
  merchant: ${MERCHANT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
